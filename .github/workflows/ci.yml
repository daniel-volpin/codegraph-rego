name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      policy: ${{ steps.filter.outputs.policy }}
      java: ${{ steps.filter.outputs.java }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            backend:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'app.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile.backend'
              - 'api/**'
              - 'codegraph/**'
              - 'configs/**'
              - 'policy/**'
              - 'scripts/**'
              - 'tools/java-parser/**'
              - 'tests/**'
            frontend:
              - '.github/workflows/ci.yml'
              - 'frontend/**'
            policy:
              - '.github/workflows/ci.yml'
              - 'policy/**'
            java:
              - '.github/workflows/ci.yml'
              - 'tools/java-parser/**'

  policy-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
          version: "0.12.13"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install OPA
        env:
          OPA_VERSION: v1.20.2
        run: |
          curl -fsSL -o /usr/local/bin/opa "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: Install OpenGrep
        env:
          OPENGREP_VERSION: v1.30.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh \
            | bash -s -- -v "${OPENGREP_VERSION}"
          echo "${HOME}/.opengrep/cli/latest" >> "${GITHUB_PATH}"
          "${HOME}/.opengrep/cli/latest/opengrep" --version

      - name: Run policy check
        run: make policy-check

      - name: Run OpenGrep taint rule contract tests
        run: make opengrep-test

      - name: Run backend lint
        run: uvx ruff@0.16.7 check .

  java-parser:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven local repository
        uses: actions/cache@v6.1.0
        with:
          path: build/jdt-tools/m2
          key: maven-jdt-${{ runner.os }}-${{ hashFiles('tools/java-parser/pom.xml') }}
          restore-keys: |
            maven-jdt-${{ runner.os }}-

      - name: Build Java parser adapter
        run: make java-parser-build

      - name: Upload Java parser artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: java-parser-jar
          path: tools/java-parser/target/codegraph-java-parser.jar
          retention-days: 1

  backend-tests:
    name: backend (${{ matrix.name }})
    needs: [changes, policy-lint, java-parser]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "policy-java"
            paths: "tests/codegraph/policy tests/codegraph/java"
          - name: "remediation-runtime"
            paths: "tests/codegraph/remediation/test_apply_fix.py tests/codegraph/remediation/test_agentic_remediation.py tests/codegraph/remediation/test_orchestration_*.py tests/codegraph/remediation/test_scoped_verification.py tests/codegraph/remediation/test_verification.py tests/codegraph/remediation/test_remediation_flow.py"
          - name: "remediation-units"
            paths: "tests/codegraph/remediation/test_repair_intent.py tests/codegraph/remediation/test_generation_parsing.py tests/codegraph/remediation/test_comparison.py tests/codegraph/remediation/test_candidate_overlay.py tests/codegraph/remediation/test_patch_compiler*.py tests/codegraph/remediation/test_file_format_preservation.py tests/codegraph/remediation/test_remediation_confidence.py tests/codegraph/remediation/test_ranking.py tests/codegraph/remediation/test_remediation_editing.py tests/codegraph/remediation/test_dossier.py tests/codegraph/remediation/test_attempts_unit.py tests/codegraph/remediation/test_jdt_remediation_cutover.py"
          - name: "ingestion-eval-llm"
            paths: "tests/codegraph/ingestion tests/codegraph/llm tests/codegraph/evaluation tests/codegraph/common tests/codegraph/app"
          - name: "api-scripts-core"
            paths: "tests/api tests/scripts tests/baselines tests/test_*.py tests/codegraph/config tests/codegraph/db tests/codegraph/embedding tests/codegraph/search tests/codegraph/test_*.py"
    env:
      NEO4J_PASS: test-password
      UV_CACHE_DIR: ~/.cache/uv
      OTEL_SDK_DISABLED: "true"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Java parser artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: java-parser-jar
          path: tools/java-parser/target

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
          version: "0.12.13"

      - name: Cache uv and virtualenv
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py314-${{ hashFiles('.python-version', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py314-

      - name: Cache HuggingFace models
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Install OPA
        env:
          OPA_VERSION: v1.20.2
        run: |
          curl -fsSL -o /usr/local/bin/opa "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: Install OpenGrep
        env:
          OPENGREP_VERSION: v1.30.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh \
            | bash -s -- -v "${OPENGREP_VERSION}"
          echo "${HOME}/.opengrep/cli/latest" >> "${GITHUB_PATH}"
          "${HOME}/.opengrep/cli/latest/opengrep" --version

      - name: Run backend tests (${{ matrix.name }})
        run: uv run python -m pytest -n auto --dist=loadfile -q ${{ matrix.paths }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Run frontend lint
        run: yarn lint

      - name: Run frontend unit tests
        run: yarn test

      - name: Build frontend
        run: yarn build

  ci-success:
    name: CI success
    if: always()
    needs:
      - changes
      - policy-lint
      - java-parser
      - backend-tests
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          POLICY_RESULT: ${{ needs.policy-lint.result }}
          JAVA_RESULT: ${{ needs.java-parser.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes job finished with: $CHANGES_RESULT" >&2
            exit 1
          fi

          for result in "$POLICY_RESULT" "$JAVA_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "required CI job finished with: $result" >&2
              exit 1
            fi
          done
