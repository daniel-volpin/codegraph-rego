name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Evaluate CI status gate
        id: ci_gate
        uses: actions/github-script@v7
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const sha = context.payload.pull_request.head.sha;

            const combined = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            const statusIsPassing = combined.data.state === "success" || combined.data.state === "neutral";
            const checksArePassing = checks.data.check_runs.every((run) => {
              if (run.status !== "completed") {
                return false;
              }
              return ["success", "neutral", "skipped"].includes(run.conclusion);
            });

            const ciOk = statusIsPassing && checksArePassing;
            core.info(`CI gate for ${sha}: ${ciOk ? "passing" : "not passing"}`);
            core.setOutput("ci_ok", ciOk ? "true" : "false");

      - name: Auto-approve patch/minor updates
        if: >-
          ${{
            steps.ci_gate.outputs.ci_ok == 'true' &&
            (
              steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
              steps.metadata.outputs.update-type == 'version-update:semver-minor'
            )
          }}
        uses: actions/github-script@v7
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "APPROVE",
              body: "Auto-approving safe Dependabot patch/minor update."
            });

      - name: Enable auto-merge for patch/minor updates
        if: >-
          ${{
            steps.ci_gate.outputs.ci_ok == 'true' &&
            (
              steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
              steps.metadata.outputs.update-type == 'version-update:semver-minor'
            )
          }}
        uses: actions/github-script@v7
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const pullRequestId = context.payload.pull_request.node_id;
            await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest {
                    number
                  }
                }
              }`,
              { pullRequestId }
            );
