name: Delete Merged Branches

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged head branch when safe
        uses: actions/github-script@v9
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const pr = context.payload.pull_request;
            const repo = context.payload.repository;

            const branch = pr.head.ref;
            const defaultBranch = repo.default_branch;
            const baseFullName = `${context.repo.owner}/${context.repo.repo}`;
            const headFullName = pr.head.repo?.full_name;

            if (headFullName !== baseFullName) {
              core.info(`Skipping fork branch ${headFullName}:${branch}`);
              return;
            }

            if (branch === defaultBranch) {
              core.info(`Skipping default branch ${branch}`);
              return;
            }

            try {
              const branchInfo = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch,
              });

              if (branchInfo.data.protected) {
                core.info(`Skipping protected branch ${branch}`);
                return;
              }
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} already deleted`);
                return;
              }
              throw error;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted branch ${branch}`);
            } catch (error) {
              if (error.status === 422 || error.status === 404) {
                core.info(`Branch ${branch} cannot be deleted or is already gone`);
                return;
              }
              throw error;
            }
