name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Skip on private repositories unless GHAS / code scanning has been
    # explicitly enabled via the repository variable ENABLE_GHAS_WORKFLOWS.
    # github.event.repository.visibility is 'public' for public repos;
    # vars.ENABLE_GHAS_WORKFLOWS can be set to 'true' in Settings → Variables
    # to opt a private repo into CodeQL once GHAS is licensed.
    if: >-
      github.event.repository.visibility == 'public' ||
      vars.ENABLE_GHAS_WORKFLOWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python', 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.2
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}

    - name: Set up Java
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: "21"

    - name: Build Java parser adapter
      if: matrix.language == 'java-kotlin'
      run: make java-parser-build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.38.2
      with:
        category: "/language:${{ matrix.language }}"
