version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(py)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      python-api:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "aiofiles"
          - "python-multipart"
          - "pydantic"
          - "pydantic-settings"
        update-types:
          - "minor"
          - "patch"
      python-ml:
        patterns:
          - "sentence-transformers"
          - "faiss-cpu"
          - "numpy"
        update-types:
          - "minor"
          - "patch"
      python-observability:
        patterns:
          - "opentelemetry-*"
        update-types:
          - "minor"
          - "patch"
      python-dev:
        patterns:
          - "pytest"
          - "httpx"
          - "ruff"
        update-types:
          - "minor"
          - "patch"
      python-patches:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(ui)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend-observability:
        patterns:
          - "@opentelemetry/*"
          - "web-vitals"
        update-types:
          - "minor"
          - "patch"
      frontend-react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      frontend-ui:
        patterns:
          - "@radix-ui/*"
          - "class-variance-authority"
          - "clsx"
          - "lucide-react"
          - "sonner"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"
      frontend-data-state:
        patterns:
          - "@tanstack/*"
          - "idb-keyval"
          - "zod"
          - "zustand"
        update-types:
          - "minor"
          - "patch"
      frontend-routing-content:
        patterns:
          - "react-markdown"
          - "react-router-dom"
          - "react-syntax-highlighter"
        update-types:
          - "minor"
          - "patch"
      frontend-testing:
        patterns:
          - "@axe-core/*"
          - "@playwright/*"
          - "@testing-library/*"
          - "fake-indexeddb"
          - "jsdom"
          - "msw"
          - "vitest"
        update-types:
          - "minor"
          - "patch"
      frontend-build:
        patterns:
          - "@tailwindcss/*"
          - "@typescript-eslint/*"
          - "@vitejs/*"
          - "autoprefixer"
          - "eslint"
          - "eslint-*"
          - "postcss"
          - "tailwindcss"
          - "typescript"
          - "vite"
        update-types:
          - "minor"
          - "patch"
      frontend-patches:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(docker-backend)"
    groups:
      docker-backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(docker-frontend)"
    groups:
      docker-frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
