  <rect x="493" y="306" width="610" height="8" rx="4" fill="url(#accent)"/>
  <text x="490" y="375" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="34">Benchmark-backed Java security</text>
