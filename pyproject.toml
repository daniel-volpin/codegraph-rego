[project]
name = "codegraph"
version = "0.1.0"
description = "A sophisticated code search and understanding engine powered by CodeGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniel Volpin" },
]
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "aiofiles==25.1.0",
    "python-multipart==0.0.22",
    "sentence-transformers==5.3.0",
    "faiss-cpu==1.13.2",
    "numpy==1.26.4",
    "neo4j==6.1.0",
    "javalang==0.13.0",
    "pydantic>=1.10,<3",
    "python-dotenv==1.2.2",
    "litellm==1.82.1",
]

[project.urls]
Repository = "https://github.com/daniel-volpin/codegraph-rego"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "httpx>=0.24.1",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
