[project]
name = "codegraph"
version = "0.6.0"
description = "Benchmark-backed JVM security and compliance framework with graph-structured evidence"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Daniel Volpin" },
]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "aiofiles==25.1.0",
    "python-multipart==0.0.32",
    "sentence-transformers==6.0.1",
    "faiss-cpu==1.15.0",
    "numpy==2.5.3",
    "neo4j==6.3.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "openai==3.13.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "httpx2==2.12.0",
]

[project.urls]
Repository = "https://github.com/daniel-volpin/codegraph-rego"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.7",
    "pyyaml==6.0.3",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Keep the existing lint policy explicit across Ruff releases.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: End-to-end integration tests requiring live external services (e.g. Neo4j).",
]
filterwarnings = [
    "ignore:.*SwigPyPacked has no __module__ attribute.*:DeprecationWarning",
    "ignore:.*SwigPyObject has no __module__ attribute.*:DeprecationWarning",
    "ignore:.*swigvarlink has no __module__ attribute.*:DeprecationWarning",
    "ignore:.*anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]
