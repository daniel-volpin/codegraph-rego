[project]
name = "codegraph"
version = "0.5.0"
description = "A sophisticated code search and understanding engine powered by CodeGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniel Volpin" },
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn>=0.42.0",
    "aiofiles==25.1.0",
    "python-multipart==0.0.27",
    "sentence-transformers==5.4.1",
    "faiss-cpu==1.13.2",
    "numpy>=2.0.0,<3",
    "neo4j==6.1.0",
    "javalang==0.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.0",
    "openai>=2.29.0",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-instrumentation-fastapi==0.62b1",
    "opentelemetry-instrumentation-httpx==0.62b1",
]

[project.urls]
Repository = "https://github.com/daniel-volpin/codegraph-rego"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.24.1",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Keep ruff's defaults and add import sorting (I) and pyupgrade (UP) so
# type-hint modernization (PEP 585/604) and import order stay enforced
# and cannot drift back.
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:.*SwigPyPacked has no __module__ attribute.*:DeprecationWarning",
    "ignore:.*SwigPyObject has no __module__ attribute.*:DeprecationWarning",
    "ignore:.*swigvarlink has no __module__ attribute.*:DeprecationWarning",
]

