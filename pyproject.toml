[project]
name = "codegraph"
version = "0.5.0"
description = "A sophisticated code search and understanding engine powered by CodeGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniel Volpin" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.42.0",
    "aiofiles==25.1.0",
    "python-multipart==0.0.22",
    "sentence-transformers==5.3.0",
    "faiss-cpu==1.13.2",
    "numpy>=2.0.0,<3",
    "neo4j==6.1.0",
    "javalang==0.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.0",
    "openai>=2.29.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-instrumentation-fastapi==0.61b0",
    "opentelemetry-instrumentation-httpx==0.61b0",
]

[project.urls]
Repository = "https://github.com/daniel-volpin/codegraph-rego"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.1",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
