services:
  neo4j:
    image: neo4j:5.26.20
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASS:-password}
      - NEO4J_PLUGINS=["apoc"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u neo4j -p $$(printf '%s' \"$$NEO4J_AUTH\" | cut -d/ -f2-) 'RETURN 1;' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASS=${NEO4J_PASS:-password}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app # Hot reload
      - /app/.venv # Don't overwrite venv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  neo4j_data:
